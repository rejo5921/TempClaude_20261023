<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>성장 기록 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: 사내 관리 사이트 안의 한 페이지. 상단 바(경로·연도·역할 전환) + 본문 1열, 리뷰 화면만 2열 */
:root{
  --bg:#f4f6f5; --surface:#ffffff; --sunk:#eef1ef; --ink:#18211f; --muted:#5a6763; --line:#dce2df;
  --accent:#1d5c57; --accent-ink:#ffffff; --accent-soft:#e1eeec;
  --stamp:#c0392b;
  --ok:#2c7a4c; --ok-soft:#e2f2e8; --warn:#a8691a; --warn-soft:#fbf0dd; --crit:#bf3a2c; --crit-soft:#fbe5e2; --info:#2b58a0; --info-soft:#e3ebf8;
  --font:"IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111716; --surface:#192120; --sunk:#141b1a; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2a3432;
  --accent:#6dbcb3; --accent-ink:#0d1716; --accent-soft:#1c3230; --stamp:#e3705f;
  --ok:#62c08a; --ok-soft:#173022; --warn:#e2ac55; --warn-soft:#33270f; --crit:#e3705f; --crit-soft:#3a1c18; --info:#82a8e8; --info-soft:#1a2740;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#192120; --sunk:#141b1a; --ink:#e5ebe9; --muted:#9aa8a4; --line:#2a3432;
  --accent:#6dbcb3; --accent-ink:#0d1716; --accent-soft:#1c3230; --stamp:#e3705f;
  --ok:#62c08a; --ok-soft:#173022; --warn:#e2ac55; --warn-soft:#33270f; --crit:#e3705f; --crit-soft:#3a1c18; --info:#82a8e8; --info-soft:#1a2740;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.crumb b{color:var(--ink);font-weight:600;font-size:15px}
.proto{font-family:var(--mono);font-size:11px;letter-spacing:.04em;padding:2px 7px;border:1px dashed var(--warn);color:var(--warn);border-radius:4px}
.top-right{margin-left:auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
select.year{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--sunk)}
.seg button{border:0;background:transparent;padding:6px 12px;cursor:pointer;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}

main{padding-block:24px 64px;display:grid;gap:24px}
.eyebrow{font-size:11.5px;letter-spacing:.06em;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:16px}
.panel-b{padding:18px}
.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* pills, hex badges, stamp */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.muted{background:var(--sunk);color:var(--muted)}
.hex{display:inline-grid;place-items:center;width:22px;height:24px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.hex.off{background:var(--line);color:var(--muted)}
.stamp{position:absolute;right:12px;bottom:10px;width:48px;height:48px;border:2px solid var(--stamp);border-radius:50%;color:var(--stamp);display:grid;place-content:center;text-align:center;font-weight:700;font-size:12px;line-height:1.1;transform:rotate(-12deg);opacity:.85}
.stamp small{display:block;font-size:9.5px;font-weight:500}

/* person header */
.person{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end;justify-content:space-between}
.person h1{font-size:24px}
.person h1 span{font-size:14px;font-weight:500;color:var(--muted);margin-left:6px}
.stats{display:flex;flex-wrap:wrap;gap:8px 28px;margin:0}
.stats div{display:grid;gap:2px}
.stats dt{font-size:12px;color:var(--muted)}
.stats dd{margin:0;font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}

/* quarter timeline */
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.timeline{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qcard{position:relative;width:100%;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;min-height:132px;align-content:start}
.qcard:hover{border-color:var(--muted)}
.qcard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.qlabel{font-family:var(--mono);font-weight:500;font-size:18px}
.qnow{font-size:11px;color:var(--accent);font-weight:600;margin-left:6px;font-family:var(--font)}
.qdates{font-family:var(--mono);font-size:12px;color:var(--muted)}
.qmeta{display:grid;gap:3px;font-size:12.5px;color:var(--muted)}
.qmeta b{color:var(--ink);font-weight:600}

/* forms */
.form{display:grid;gap:28px}
.fs{display:grid;gap:16px;border:0;padding:0;margin:0;min-width:0}
.fs-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.fs-h h3{font-size:15px}
.field{display:grid;gap:5px;min-width:0}
.field label,.flabel{font-weight:600;font-size:13px}
.hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=date],input[type=number],select.in,textarea{width:100%;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:8px 10px}
textarea{min-height:76px;resize:vertical;line-height:1.55}
input[type=number]{width:90px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.row > .field{flex:1 1 200px}
.range{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.range input[type=date]{width:auto;flex:1 1 140px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.mission{border:1px solid var(--line);border-radius:var(--r);background:var(--sunk);padding:16px;display:grid;gap:14px}
.mission-h{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.mission-h h4{margin:0;font-size:14px}
.mission-h .spacer{flex:1}
.add-row{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:500;font-size:13.5px}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}
.val{display:grid;gap:4px;font-size:13px;border-radius:6px;padding:12px 14px}
.val:empty{display:none}
.val.has-err{background:var(--crit-soft);color:var(--crit)}
.val.only-warn{background:var(--warn-soft);color:var(--warn)}
.val.ok{background:var(--ok-soft);color:var(--ok)}
.val p{margin:0}
.notice{border-radius:6px;padding:12px 14px;font-size:13px;display:grid;gap:4px}
.notice.crit{background:var(--crit-soft);color:var(--crit)}
.notice.info{background:var(--info-soft);color:var(--info)}

/* read view */
.read{display:grid;gap:22px}
.qa{display:grid;gap:14px;margin:0}
.qa dt{font-size:12.5px;font-weight:600;color:var(--muted)}
.qa dd{margin:2px 0 0;white-space:pre-wrap}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;white-space:pre-wrap;min-width:0}
@media (max-width:560px){.kv{grid-template-columns:1fr}.kv dd{margin-bottom:6px}}
.review-box{border-left:3px solid var(--accent);padding:4px 0 4px 14px;display:grid;gap:10px}
.docs{display:flex;flex-wrap:wrap;gap:8px}
.doc{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:4px 9px;background:var(--sunk)}
.doc b{font-family:var(--font);font-weight:600;margin-right:6px}

/* team table */
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.name b{display:block}
td.name span{font-size:12px;color:var(--muted)}
.cell{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 8px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;cursor:pointer;text-align:left}
.cell:hover{border-color:var(--line);background:var(--sunk)}
.cell small{font-size:11.5px;color:var(--muted)}
.cell.dim{opacity:.35}
td.total{font-weight:600;font-variant-numeric:tabular-nums}

/* review */
.rv-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rv-bar h1{font-size:20px}
.rv-bar .spacer{flex:1}
.rv-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:920px){.rv-grid{grid-template-columns:1fr}}
.rv-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:920px){.rv-side{position:static}}
.radios{display:grid;gap:6px}
.radios label{display:flex;gap:8px;align-items:center;font-weight:400;font-size:13.5px;cursor:pointer}
.grant{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.grant:last-child{border-bottom:0}
.grant select{width:auto}

/* admin */
.admin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.admin-grid{grid-template-columns:1fr}}
.admin-grid .wide{grid-column:1/-1}
.qset{display:grid;gap:8px}
.qset .r{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.qset .r span.q{font-family:var(--mono);width:28px}
.qset input{width:auto;flex:1 1 130px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk);min-width:120px}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.copybox{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}
.log{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.log li{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13.5px;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:20}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:0}}}
</style>

<header class="top">
  <div class="wrap">
    <div class="crumb">one <span aria-hidden="true">›</span> 인사 <span aria-hidden="true">›</span> <b>성장 기록</b> <span class="proto">PROTOTYPE · 예시 데이터</span></div>
    <div class="top-right">
      <select class="year" id="year" aria-label="평가연도">
        <option>2026 평가연도 (2026.01.02 – 2027.01.01)</option>
        <option disabled>2025 평가연도 · 이관 대상 아님</option>

      <div class="seg" role="group" aria-label="역할 전환">
        <button data-role="member">구성원 · 변한솔</button>
        <button data-role="team">팀장 · 안대훈</button>
        <button data-role="admin">운영자 · 이민철</button>
      </div>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
const TODAY = '2026-10-23';
const TEAM = 'FinanceOps 6팀';
const LEADER = '안대훈';
const STORE_KEY = 'growth-record-proto-v1';

const MEMBERS = [
  {id:'byun', name:'변한솔', title:'프로', level:'Lv.3'},
  {id:'kim',  name:'김서연', title:'프로', level:'Lv.2'},
  {id:'park', name:'박준호', title:'프로', level:'Lv.4'},
  {id:'lee',  name:'이도윤', title:'프로', level:'Lv.1'},
  {id:'choi', name:'최하은', title:'프로', level:'Lv.3'},
];
const ME = 'byun';

const ONE = [
  {k:'proud',  label:'이번 분기에 어떤 여정을 지나왔나요?', hint:'특별히 기억에 남는 성과나 도전, 그 과정의 어려움을 어떻게 해결했는지', req:true},
  {k:'growth', label:'내 안에서 자라난 변화는 무엇인가요?', hint:'업무·협업·태도에서 성장했다고 느낀 부분', req:true},
  {k:'next',   label:'앞으로 어떤 길을 걸어보고 싶은가요?', hint:'다음 분기에 도전하고 싶은 과제나 목표', req:true},
  {k:'tf',     label:'TF 참여 or 타팀 협업 (대상자만)', hint:'제안 참여, 타팀 지원 등 자발적으로 지원한 사례. TF 회당 5점, 타팀 협업 회당 2점'},
  {k:'ask',    label:'리더에게 받고 싶은 조언이나 도움', hint:'일·성장·관계 중 고민되거나 조언이 필요한 주제'},
];

const MT = {
  common:{label:'누구나 수행 가능한 미션', short:'공통', fixed:1, fields:[
    {k:'item', label:'미션 항목', type:'text', ph:'예) 자격증 취득(SQLD), 석사 학위 취득, 산업 컨퍼런스 발표'},
    {k:'date', label:'취득(완료)일', type:'date'},
    {k:'relevance', label:'업무 연관성', type:'textarea', opt:true, hint:'운영가이드에 열거된 자격증(정보처리기사, SQLD, PMP 등)은 생략 가능'},
    {k:'evidence', label:'증빙', type:'text', ph:'첨부 파일명 (합격증, 학위증, 발표 자료 등)'},
  ]},
  job:{label:'직무&레벨 미션', short:'직무&레벨', fields:[
    {k:'title', label:'미션 명', type:'text', ph:'무엇을, 어떤 수준으로 달성했는지 한 문장'},
    {k:'period', label:'수행기간', type:'range'},
    {k:'goal', label:'미션 선정 이유 및 목표', type:'textarea', hint:'[선정 이유] 분기 시작 시점의 문제 / [목표] 가능한 한 수치나 기한으로'},
    {k:'actions', label:'달성을 위해 실행한 내용', type:'textarea', hint:'본인이 직접 수행한 것만. [활동 구분] 무엇을 했고 어떤 어려움을 어떻게 해결했는지'},
    {k:'result', label:'결과 지표 및 증빙', type:'textarea', hint:'건수, 비율, 단축 일수, 규모 등 수치 우선. 증빙 파일명 기재'},
    {k:'special', label:'특별 성과 근거', type:'textarea', special:true, hint:'본인 레벨에 기대되는 본연 업무를 어떤 점에서 명확히 상회했는지'},
  ]},
  project:{label:'프로젝트 미션', short:'프로젝트', fields:[
    {k:'title', label:'프로젝트명 / 업무명', type:'text', ph:'고객사와 사업명. 예) 카카오뱅크 FingerCM 운영'},
    {k:'kind', label:'프로젝트 구분', type:'select', options:['신규 프로젝트','분기 내 완료','진행 중','운영/유지보수','제안','기타']},
    {k:'period', label:'투입 기간', type:'range', ongoing:true},
    {k:'roles', label:'본인 역할', type:'chips', options:['PM','PL','제안 PM','PMO','개발','기획','디자인/퍼블리싱','운영/유지보수','영업']},

const tfPts = r => (Number(r.one.tfCount)||0)*5 + (Number(r.one.collabCount)||0)*2;
function yearStats(mid){
  const rs = S.records[mid];
  return {
    badges: rs.reduce((a,r)=>a+granted(r),0),
    ones: rs.filter(r=>r.status==='done').length,
    tf: rs.filter(r=>r.status==='done'||r.status==='submitted').reduce((a,r)=>a+tfPts(r),0),
    common: commonUsedElsewhere(mid, -1),
  };
}
function commonUsedElsewhere(mid, qi){
  const rs = S.records[mid];
  for (let i=0;i<rs.length;i++){ if (i===qi) continue; const r = rs[i];
    if ((r.status==='submitted'||r.status==='done') && r.missions.some(m=>m.type==='common')) return i; }
  return null;
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(()=>t.hidden = true, 3200); }

/* ---------- validation ---------- */
function validateMember(mid, qi){
  const r = rec(mid, qi), q = Q(qi), errs = [], warns = [];
  ONE.filter(o=>o.req).forEach(o => { if (!String(r.one[o.k]||'').trim()) errs.push(`1on1 카드: ‘${o.label}’ 항목이 비어 있습니다.`); });
  if (!r.one.meetReq) warns.push('1on1 희망일을 입력하면 팀장에게 일정 요청이 함께 전달됩니다.');
  const commons = r.missions.filter(m=>m.type==='common');
  if (commons.length > 1) errs.push('누구나 수행 가능한 미션은 연 1개만 신청할 수 있습니다.');
  if (commons.length){ const u = commonUsedElsewhere(mid, qi); if (u !== null) errs.push(`누구나 수행 가능한 미션은 연 1개입니다. 이미 Q${u+1}에 신청했습니다.`); }
  r.missions.forEach((m, i) => {
    const t = MT[m.type], name = `${t.short} 미션 ${i+1}`;
    t.fields.forEach(f => {
      if (f.special){ if (m.badges === 2 && !String(m.f.special||'').trim()) errs.push(`${name}: 배지 2개 신청 시 ‘특별 성과 근거’가 필요합니다.`); return; }
      if (f.opt) return;
      const v = m.f[f.k];
      if (f.type === 'range'){ if (!m.f.start || (!m.f.end && !m.f.ongoing)) errs.push(`${name}: ‘${f.label}’을 입력해 주세요.`); return; }
      if (f.type === 'chips'){ if (!(v||[]).length) errs.push(`${name}: ‘${f.label}’을 하나 이상 선택해 주세요.`); return; }
      if (!String(v||'').trim()) errs.push(`${name}: ‘${f.label}’ 항목이 비어 있습니다.`);
    });
    if (m.f.start && m.f.start > q.end) warns.push(`${name}: 시작일이 Q${qi+1} 종료일(${ymd(q.end)}) 이후입니다.`);
    if (m.f.end && !m.f.ongoing && m.f.end < q.start) warns.push(`${name}: 종료일이 Q${qi+1} 시작일(${ymd(q.start)}) 이전입니다.`);
    if (m.type === 'common' && m.f.date && (m.f.date < q.start || m.f.date > q.end)) warns.push(`${name}: 취득일이 Q${qi+1} 기간 밖입니다.`);
    if (m.f.result && !/\d/.test(m.f.result)) warns.push(`${name}: 결과 지표에 수치가 없습니다. 건수, 비율, 단축 기간을 넣으면 리뷰에서 근거로 인정받기 쉽습니다.`);
  });
  return {errs, warns};
}
function renderVal(v, okMsg){
  if (!v.errs.length && !v.warns.length) return `<div class="val ok" id="val"><p>${okMsg}</p></div>`;
  const cls = v.errs.length ? 'has-err' : 'only-warn';
  return `<div class="val ${cls}" id="val" role="status">${v.errs.map(e=>`<p>• ${esc(e)}</p>`).join('')}${v.warns.map(w=>`<p>△ ${esc(w)}</p>`).join('')}</div>`;
}

/* ---------- field rendering ---------- */
function fieldEdit(m, f){
  const id = `${m.id}-${f.k}`, v = m.f[f.k];
  const lab = f.special ? `${f.label} <span class="hint">(2개 신청 시 필수)</span>` : f.label + (f.opt ? ' <span class="hint">(선택)</span>' : '');
  const hint = f.hint ? `<span class="hint">${esc(f.hint)}</span>` : '';
  let ctl = '';
  if (f.type === 'text') ctl = `<input type="text" id="${id}" data-m="${m.id}" data-k="${f.k}" value="${esc(v)}" placeholder="${esc(f.ph||'')}">`;
  else if (f.type === 'textarea') ctl = `<textarea id="${id}" data-m="${m.id}" data-k="${f.k}">${esc(v)}</textarea>`;
  else if (f.type === 'date') ctl = `<input type="date" id="${id}" data-m="${m.id}" data-k="${f.k}" value="${esc(v)}">`;
  else if (f.type === 'select') ctl = `<select class="in" id="${id}" data-m="${m.id}" data-k="${f.k}"><option value="">선택</option>${f.options.map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
  else if (f.type === 'chips') ctl = `<div class="chips">${f.options.map(o=>`<button type="button" class="chip" data-chip="${esc(o)}" data-m="${m.id}" data-k="${f.k}" aria-pressed="${(v||[]).includes(o)}">${esc(o)}</button>`).join('')}</div>`;
  else if (f.type === 'range') ctl = `<div class="range"><input type="date" id="${m.id}-start" aria-label="시작일" data-m="${m.id}" data-k="start" value="${esc(m.f.start)}"><span class="muted">~</span><input type="date" id="${m.id}-end" aria-label="종료일" data-m="${m.id}" data-k="end" value="${esc(m.f.end)}" ${m.f.ongoing?'disabled':''}>${f.ongoing?`<label class="hint"><input type="checkbox" id="${m.id}-ongoing" data-m="${m.id}" data-k="ongoing" ${m.f.ongoing?'checked':''}> 진행 중</label>`:''}</div>`;
  const forId = (f.type==='chips') ? '' : `for="${f.type==='range' ? m.id+'-start' : id}"`;
  return `<div class="field">${f.type==='chips' ? `<span class="flabel">${lab}</span>` : `<label ${forId}>${lab}</label>`}${hint}${ctl}</div>`;
}
function missionEdit(m, i){
  const t = MT[m.type];
  const badgeCtl = m.type === 'common'
    ? `<span class="hint">배지 1개 고정</span>`
    : `<label class="hint" for="${m.id}-badges">배지 신청</label><select class="in" style="width:auto" id="${m.id}-badges" data-badges="${m.id}"><option value="1" ${m.badges===1?'selected':''}>1개</option><option value="2" ${m.badges===2?'selected':''}>2개</option></select>`;
  const fields = t.fields.filter(f => !f.special || m.badges === 2);
  return `<div class="mission">
    <div class="mission-h"><span class="hex">${m.type==='common'?1:m.badges}</span><h4>${t.label}</h4><span class="spacer"></span>${badgeCtl}<button type="button" class="btn ghost sm" data-del="${m.id}">삭제</button></div>
    ${fields.map(f=>fieldEdit(m,f)).join('')}
  </div>`;
}
function fieldRead(m, f){
  if (f.type === 'range'){ return `<dt>${f.label}</dt><dd class="num">${ymd(m.f.start)} ~ ${m.f.ongoing ? '진행 중' : ymd(m.f.end)}</dd>`; }
  const v = m.f[f.k];
  if (f.special && !String(v||'').trim()) return '';
  const out = Array.isArray(v) ? v.join(', ') : (f.type==='date' ? ymd(v) : v);
  return `<dt>${f.label}</dt><dd>${esc(out || '—')}</dd>`;
}
function missionRead(m, r){
  const t = MT[m.type], req = m.type==='common' ? 1 : m.badges;
  const g = r.status==='done' && r.review?.grants ? r.review.grants[m.id] : null;
  return `<div class="mission">
    <div class="mission-h"><span class="hex">${req}</span><h4>${t.label}</h4><span class="spacer"></span>
      <span class="hint">신청 ${req}개${g!==null && g!==undefined ? ` · <b style="color:var(--ink)">부여 ${g}개</b>` : ''}</span></div>
    <dl class="kv">${t.fields.map(f=>fieldRead(m,f)).join('')}</dl>
  </div>`;
}
function readView(mid, qi, opts={}){
  const r = rec(mid, qi);
  const tf = tfPts(r);
  const oneHtml = `<dl class="qa">${ONE.map(o=>`<div><dt>${o.label}</dt><dd>${esc(r.one[o.k]) || '<span class="muted">—</span>'}</dd></div>`).join('')}
    <div><dt>1on1 일정</dt><dd class="num">희망 ${md(r.one.meetReq)}${r.review?.meet ? ` · 확정 ${md(r.review.meet)}` : ''}${tf ? ` · TF·협업 ${tf}점` : ''}</dd></div></dl>`;
  const mis = r.missions.length ? r.missions.map(m=>missionRead(m,r)).join('') : '<p class="muted" style="margin:0">이번 분기 배지 신청 없음</p>';
  let rv = '';
  if (r.status === 'done' && !opts.hideReview){
    rv = `<section class="fs"><div class="fs-h"><h3>리더 리뷰</h3><span class="hint">${LEADER} 팀장 · ${ymd(r.review.at)}</span></div>
      <div class="review-box"><dl class="kv">
        <dt>성과의 정량 근거</dt><dd>${esc(r.review.quant || (r.missions.length ? '—' : '배지 신청 없음'))}</dd>
        <dt>레벨 대비 기대 역할</dt><dd>${EXPECT[r.review.expect]}</dd>
        <dt>리더의 피드백</dt><dd>${esc(r.review.feedback)}</dd>
        <dt>최종 부여</dt><dd><b>배지 ${granted(r)}개</b></dd></dl></div>
      <div class="docs">${r.gw.map(d=>`<span class="doc"><b>${d.kind}</b>${d.no}</span>`).join('')}</div>
      <p class="hint" style="margin:0">위 문서번호는 그룹웨어 결재 문서로 자동 생성된 기록입니다. (프로토타입: 가상 번호)</p></section>`;
  }
  return `<div class="read">
    <section class="fs"><div class="fs-h"><h3>1on1 미팅 카드</h3></div>${oneHtml}</section>
    <section class="fs"><div class="fs-h"><h3>배지 신청</h3><span class="hint">신청 ${requested(r)}개</span></div>${mis}</section>
    ${rv}</div>`;
}

/* ---------- member view ---------- */
function renderMember(){
  const mid = ME, me = member(mid), st = yearStats(mid), cq = currentQ();
  const cards = S.settings.quarters.map((q, qi) => {
    const r = rec(mid, qi), ds = dstatus(r, qi);
    return `<li><button class="qcard" data-q="${qi}" aria-current="${UI.memberQ===qi}">
      <div class="qtop"><span class="qlabel">Q${qi+1}${qi===cq?'<span class="qnow">진행 중</span>':''}</span>${pill(ds)}</div>
      <div class="qdates">${md(q.start)} – ${md(q.end)}</div>
      <div class="qmeta"><span>1on1 <b class="num">${r.review?.meet ? md(r.review.meet) : (r.one.meetReq ? '희망 '+md(r.one.meetReq) : '—')}</b></span>

    const late = ds==='missing' ? `<div class="notice info"><b>Q${qi+1} 기간이 지났습니다.</b><span>지금 제출해도 팀장 리뷰로 넘어가며, 운영자 현황에는 지연 제출로 표시됩니다.</span></div>` : '';
    detail = `<form class="form" id="mform" novalidate>
      ${rej}${late}
      <fieldset class="fs"><div class="fs-h"><h3>1on1 미팅 카드</h3><span class="hint">분기 1회 필수</span></div>
        ${ONE.map(o=>`<div class="field"><label for="one-${o.k}">${o.label}${o.req?'':' <span class="hint">(선택)</span>'}</label><span class="hint">${o.hint}</span><textarea id="one-${o.k}" data-one="${o.k}">${esc(r.one[o.k])}</textarea></div>`).join('')}
        <div class="row">
          <div class="field" style="flex:0 1 auto"><label for="one-tfCount">TF 참여 횟수</label><input type="number" min="0" id="one-tfCount" data-one="tfCount" value="${Number(r.one.tfCount)||0}"></div>
          <div class="field" style="flex:0 1 auto"><label for="one-collabCount">타팀 협업 횟수</label><input type="number" min="0" id="one-collabCount" data-one="collabCount" value="${Number(r.one.collabCount)||0}"></div>
          <div class="field" style="flex:0 1 180px"><label for="one-meetReq">1on1 희망일</label><input type="date" id="one-meetReq" data-one="meetReq" value="${esc(r.one.meetReq)}"></div>
          <p class="hint" style="margin:0 0 8px" id="tfsum">TF·협업 점수 ${tfPts(r)}점</p>
        </div>
      </fieldset>
      <fieldset class="fs"><div class="fs-h"><h3>배지 신청 <span class="hint">(선택)</span></h3><span class="hint">신청 ${requested(r)}개</span></div>
        ${r.missions.map(missionEdit).join('')}
        <div class="add-row">
          <button type="button" class="btn sm" data-add="common" ${hasCommon || used!==null ? 'disabled':''}>+ 누구나 수행 가능한 미션</button>
          <button type="button" class="btn sm" data-add="job">+ 직무&레벨 미션</button>

  <section class="panel">
    <div class="panel-h"><h2>Q${qi+1} 기록</h2><span class="hint num">${ymd(Q(qi).start)} ~ ${ymd(Q(qi).end)}</span>${pill(ds)}</div>

  </section>`;
}

/* ---------- team view ---------- */
function pendingList(){ const out=[]; MEMBERS.forEach(m=>S.records[m.id].forEach((r,qi)=>{ if(r.status==='submitted') out.push([m.id,qi]); })); return out; }
function renderTeam(){
  const cq = currentQ();
  let pend=0, miss=0, rej=0;
  MEMBERS.forEach(m=>S.records[m.id].forEach((r,qi)=>{ const d=dstatus(r,qi); if(d==='submitted')pend++; if(d==='missing')miss++; if(d==='rejected')rej++; }));
  const match = (r,qi) => UI.filter==='all' || (UI.filter==='pending' && r.status==='submitted') || (UI.filter==='missing' && dstatus(r,qi)==='missing') || (UI.filter==='rejected' && r.status==='rejected');
  const rows = MEMBERS.map(m => {
    const rs = S.records[m.id];
    const cells = rs.map((r,qi)=>{ const d = dstatus(r,qi);
      const sub = r.status==='done' ? `배지 ${granted(r)}개 부여` : (requested(r) ? `신청 ${requested(r)}개` : (d==='draft'&&qi===cq ? '작성 기간' : '—'));
      return `<td><button class="cell ${match(r,qi)?'':'dim'}" data-review="${m.id}:${qi}" aria-label="${m.name} Q${qi+1} ${STATUS[d][0]}">${pill(d)}<small>${sub}</small></button></td>`; }).join('');
    const total = rs.reduce((a,r)=>a+granted(r),0);
    return `<tr><td class="name"><b>${m.name}</b><span>${m.title} · ${m.level}</span></td>${cells}<td class="total">${total}</td></tr>`;

  const f = (k,l,n) => `<button class="chip" data-filter="${k}" aria-pressed="${UI.filter===k}">${l}${n!==undefined?` ${n}`:''}</button>`;
  const first = pendingList()[0];
  return `
  <section class="person">
    <div><p class="eyebrow">팀 성장 현황</p><h1>${TEAM}<span>2026 평가연도 · 팀원 ${MEMBERS.length}명</span></h1>
      <p class="muted" style="margin:4px 0 0">${LEADER} 팀장 · 소속 팀원 기록 열람 및 리뷰 권한</p></div>
    <dl class="stats">
      <div><dt>리뷰 대기</dt><dd style="color:var(--info)">${pend}건</dd></div>
      <div><dt>미제출</dt><dd style="color:var(--warn)">${miss}건</dd></div>
      <div><dt>반려 후 재작성</dt><dd>${rej}건</dd></div>
    </dl>
  </section>
  <section class="panel">
    <div class="panel-h"><h2>팀원 × 분기</h2><span class="hint">칸을 누르면 해당 분기 기록을 엽니다</span>
      <div class="filters">${f('all','전체')}${f('pending','리뷰 대기',pend)}${f('missing','미제출',miss)}${f('rejected','반려',rej)}</div></div>
    <div class="tbl-wrap"><table>
      <thead><tr><th>팀원</th>${S.settings.quarters.map((q,qi)=>`<th>Q${qi+1} <span class="num" style="font-weight:400">${md(q.start)}–${md(q.end)}</span></th>`).join('')}<th>연간 배지</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
  </section>
  ${first ? `<div class="actions"><button class="btn primary" data-review="${first[0]}:${first[1]}">리뷰 대기 ${pend}건 순서대로 처리하기</button></div>` : ''}`;
}

/* ---------- review view ---------- */
function renderReview(){
  const [mid, qi] = UI.review, m = member(mid), r = rec(mid, qi), d = dstatus(r, qi);
  const pl = pendingList(), idx = pl.findIndex(([a,b])=>a===mid&&b===qi);

    <h1>${m.name} · Q${qi+1}</h1>${pill(d)}<span class="spacer"></span>
    ${idx>=0 ? `<span class="hint">리뷰 대기 ${idx+1} / ${pl.length}</span>` : ''}
    ${next ? `<button class="btn sm" data-review="${next[0]}:${next[1]}">다음 리뷰 대기 →</button>` : ''}</div>`;
  let side;
  if (r.status === 'submitted'){
    const grants = r.missions.map(x=>{ const req = x.type==='common'?1:x.badges;
      return `<div class="grant"><label for="g-${x.id}">${MT[x.type].short}: ${esc(x.f.title||x.f.item)}</label><select class="in" id="g-${x.id}" data-grant="${x.id}">${Array.from({length:req+1},(_,n)=>`<option value="${n}" ${n===req?'selected':''}>${n}개</option>`).join('')}</select></div>`; }).join('');
    side = `<form class="panel" id="rform" novalidate><div class="panel-h"><h2>리더 리뷰</h2></div><div class="panel-b form" style="gap:16px">
      <div class="field"><label for="rv-meet">1on1 일정 확정</label><span class="hint">구성원 희망일 ${ymd(r.one.meetReq)}</span><input type="date" id="rv-meet" value="${esc(r.one.meetReq)}"></div>
      ${r.missions.length ? `<div class="field"><label for="rv-quant">성과의 정량 근거</label><span class="hint">구성원 결과 지표를 확인하고, 리더가 확인한 수치를 기재합니다. 공통 미션은 증빙 확인 여부만.</span><textarea id="rv-quant"></textarea></div>
      <div class="field"><span class="flabel">미션별 최종 부여</span>${grants}</div>` : `<p class="hint" style="margin:0">이번 분기 배지 신청이 없어 1on1 피드백만 작성합니다.</p>`}
      <div class="field"><span class="flabel">레벨 대비 기대 역할 충족 여부</span><div class="radios">${Object.entries(EXPECT).map(([k,v])=>`<label><input type="radio" name="rv-expect" value="${k}"> ${v}</label>`).join('')}</div></div>
      <div class="field"><label for="rv-feedback">리더의 따뜻한 피드백</label><span class="hint">잘한 점, 다음 분기에 기대하는 역할</span><textarea id="rv-feedback"></textarea></div>
      <div id="rval"></div>
      <div class="field"><label for="rv-reject">반려 사유 <span class="hint">(반려 시 필수)</span></label><textarea id="rv-reject" style="min-height:56px"></textarea></div>
      <div class="actions"><button type="button" class="btn danger" data-act="reject">반려</button><button type="button" class="btn primary" data-act="approve">승인하고 결재 문서 생성</button></div>
      <p class="hint" style="margin:0">승인하면 그룹웨어에 1on1 미팅 카드${r.missions.length?'와 배지 신청서':''} 결재 문서가 생성됩니다.</p>
    </div></form>`;
  } else {
    const msg = { done:'리뷰가 완료된 기록입니다.', rejected:'반려되어 구성원이 다시 작성 중입니다.', draft:'구성원이 아직 제출하지 않았습니다.', missing:'분기가 지났지만 제출되지 않았습니다.' }[d];
    side = `<div class="panel"><div class="panel-b"><div class="notice ${d==='rejected'?'crit':'info'}"><b>${msg}</b>${r.status==='rejected'?`<span>반려 사유: ${esc(r.review?.rejectReason)}</span>`:''}</div></div></div>`;
  }
  const showContent = r.status!=='draft' || requested(r) || r.one.proud;
  return `${bar}<div class="rv-grid"><section class="panel"><div class="panel-h"><h2>구성원 작성 내용</h2><span class="hint">${m.title} · ${m.level} · ${ymd(Q(qi).start)} ~ ${ymd(Q(qi).end)}</span></div>
    <div class="panel-b">${showContent ? readView(mid, qi) : '<p class="muted" style="margin:0">작성된 내용이 없습니다.</p>'}</div></section>
    <aside class="rv-side">${side}</aside></div>`;
}
function validateReview(r){
  const errs = [];
  const quant = ($('#rv-quant')?.value || '').trim();
  const expect = document.querySelector('input[name="rv-expect"]:checked')?.value;
  const fb = $('#rv-feedback').value.trim();
  const grants = {}; r.missions.forEach(m => grants[m.id] = Number($('#g-'+m.id).value));
  const total = Object.values(grants).reduce((a,b)=>a+b,0);
  if (!expect) errs.push('레벨 대비 기대 역할 충족 여부를 선택해 주세요.');
  if (!fb) errs.push('리더의 피드백을 작성해 주세요.');
  if (total > 0 && !/\d/.test(quant)) errs.push('성과의 정량 근거에 확인한 수치를 적어 주세요. 정성 코멘트만 있으면 근거 부족으로 처리됩니다.');
  r.missions.forEach(m => { if (grants[m.id] === 2 && !String(m.f.special||'').trim()) errs.push(`${MT[m.type].short} 미션: 2개 부여에는 구성원의 특별 성과 근거가 필요합니다.`); });
  return {errs, quant, expect, fb, grants, total};
}

/* ---------- admin view ---------- */
function renderAdmin(){
  const s = S.settings;
  const counts = s.quarters.map((q,qi)=>{ const c = {done:0,submitted:0,rejected:0,draft:0,missing:0}; MEMBERS.forEach(m=>c[dstatus(rec(m.id,qi),qi)]++); return c; });
  const colors = {done:'var(--ok)', submitted:'var(--info)', rejected:'var(--crit)', missing:'var(--warn)', draft:'var(--line)'};
  const bars = counts.map((c,qi)=>`<div class="qset"><div class="r"><span class="q">Q${qi+1}</span>
    <div class="bar" style="flex:1" role="img" aria-label="Q${qi+1} 완료 ${c.done}, 리뷰 대기 ${c.submitted}, 반려 ${c.rejected}, 미제출 ${c.missing}, 작성중 ${c.draft}">${Object.keys(colors).map(k=>c[k]?`<i style="width:${c[k]/MEMBERS.length*100}%;background:${colors[k]}"></i>`:'').join('')}</div>
    <span class="hint num">완료 ${c.done}/${MEMBERS.length}</span></div></div>`).join('');
  const header = ['이름','직급','레벨','Q1 부여','Q2 부여','Q3 부여','Q4 부여','연간 배지','1on1 완료','TF·협업 점수','최근 기대역할'];
  const rows = MEMBERS.map(m=>{ const rs = S.records[m.id]; const lastDone = [...rs].reverse().find(r=>r.status==='done');
    return [m.name, m.title, m.level, ...rs.map(granted), rs.reduce((a,r)=>a+granted(r),0), rs.filter(r=>r.status==='done').length, rs.filter(r=>r.status==='done'||r.status==='submitted').reduce((a,r)=>a+tfPts(r),0), lastDone ? EXPECT[lastDone.review.expect] : '—']; });
  const docs = []; MEMBERS.forEach(m=>S.records[m.id].forEach((r,qi)=>r.gw.forEach(d=>docs.push({...d, who:m.name, qi, at:r.review?.at||''}))));
  docs.sort((a,b)=>b.at.localeCompare(a.at) || b.no.localeCompare(a.no));
  return `
  <section class="person"><div><p class="eyebrow">운영 관리</p><h1>성장 기록 운영<span>2026 평가연도</span></h1>
    <p class="muted" style="margin:4px 0 0">이민철 · 전사 열람, 평가연도 설정, 연봉 반영 데이터 추출</p></div></section>
  <div class="admin-grid">
    <section class="panel"><div class="panel-h"><h2>평가연도 설정</h2></div><div class="panel-b" style="display:grid;gap:14px">
      <dl class="kv"><dt>인사고과 기준일</dt><dd>매년 1월 2일</dd><dt>2026 평가연도</dt><dd class="num">2026.01.02 ~ 2027.01.01</dd><dt>분기 기준</dt><dd>달력 분기 (확정)</dd></dl>
      <div class="qset">${s.quarters.map((q,qi)=>`<div class="r"><span class="q">Q${qi+1}</span>
        <input type="date" id="qs-${qi}" aria-label="Q${qi+1} 시작일" data-qs="${qi}" value="${q.start}"><span class="muted">~</span>
        <input type="date" id="qe-${qi}" aria-label="Q${qi+1} 종료일" data-qe="${qi}" value="${q.end}"></div>`).join('')}</div>
      <p class="hint" style="margin:0">경계일을 바꾸면 제출 검증과 미제출 판정이 즉시 바뀝니다.</p></div></section>
    <section class="panel"><div class="panel-h"><h2>분기별 제출 현황</h2><span class="hint">${TEAM}</span></div><div class="panel-b" style="display:grid;gap:12px">
      ${bars}
      <div class="legend"><span><i style="background:var(--ok)"></i>완료</span><span><i style="background:var(--info)"></i>리뷰 대기</span><span><i style="background:var(--crit)"></i>반려</span><span><i style="background:var(--warn)"></i>미제출</span><span><i style="background:var(--line)"></i>작성중</span></div>
      <p class="hint" style="margin:0">실서비스에서는 본부·팀 단위로 펼쳐 봅니다.</p></div></section>
    <section class="panel wide"><div class="panel-h"><h2>연봉 반영 데이터</h2><span class="hint">완료된 리뷰 기준 · 엑셀에 붙여넣기용</span>
      <div class="filters"><button class="btn sm primary" data-act="copy">표 복사</button></div></div>
      <div class="tbl-wrap"><table><thead><tr>${header.map(h=>`<th>${h}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>=3&&i<=9?'num':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="panel-b" id="copyfb" hidden><label class="hint" for="copybox">복사가 막혀 있어 아래 내용을 선택했습니다. Ctrl+C로 복사하세요.</label><textarea class="copybox" id="copybox" readonly></textarea></div>
    </section>
    <section class="panel wide"><div class="panel-h"><h2>그룹웨어 결재 문서 생성 기록</h2><span class="hint">${docs.length}건 · 프로토타입은 가상 문서번호</span></div>
      <div class="panel-b"><ul class="log">${docs.slice(0,12).map(d=>`<li><span class="doc">${d.no}</span><span>${d.who} · Q${d.qi+1} · ${d.kind}</span><span class="hint num">${ymd(d.at)}</span></li>`).join('')}</ul></div></section>
  </div>
  <div class="actions"><button class="btn ghost sm" data-act="reset">예시 데이터로 초기화</button></div>`;

}
function exportTSV(){
  const header = ['이름','직급','레벨','Q1 부여','Q2 부여','Q3 부여','Q4 부여','연간 배지','1on1 완료','TF·협업 점수','최근 기대역할'];
  const rows = MEMBERS.map(m=>{ const rs = S.records[m.id]; const lastDone = [...rs].reverse().find(r=>r.status==='done');
    return [m.name, m.title, m.level, ...rs.map(granted), rs.reduce((a,r)=>a+granted(r),0), rs.filter(r=>r.status==='done').length, rs.filter(r=>r.status==='done'||r.status==='submitted').reduce((a,r)=>a+tfPts(r),0), lastDone ? EXPECT[lastDone.review.expect] : '—']; });
  return [header, ...rows].map(r=>r.join('\t')).join('\n');
}

/* ---------- render & events ---------- */
function render(){
  document.querySelectorAll('[data-role]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.role===UI.role));
  const app = $('#app');
  if (UI.role === 'member') app.innerHTML = renderMember();
  else if (UI.role === 'team') app.innerHTML = UI.review ? renderReview() : renderTeam();
  else app.innerHTML = renderAdmin();
}
function refreshVal(){
  if (UI.role !== 'member') return;
  const el = $('#val'); if (!el) return;
  el.outerHTML = renderVal(validateMember(ME, UI.memberQ), '제출할 수 있습니다.');
  const t = $('#tfsum'); if (t) t.textContent = `TF·협업 점수 ${tfPts(rec(ME, UI.memberQ))}점`;
}
function findMission(id){ const r = rec(ME, UI.memberQ); return r.missions.find(m=>m.id===id); }

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.role){ UI.role = t.dataset.role; UI.review = null; render(); scrollTo(0,0); return; }
  if (t.dataset.q){ UI.memberQ = Number(t.dataset.q); render(); return; }
  if (t.dataset.filter){ UI.filter = t.dataset.filter; render(); return; }
  if (t.dataset.review){ const [mid, qi] = t.dataset.review.split(':'); UI.review = [mid, Number(qi)]; render(); scrollTo(0,0); return; }
  if (t.dataset.add){ const r = rec(ME, UI.memberQ); r.missions.push(M(t.dataset.add, 1, {})); save(); render(); return; }
  if (t.dataset.del){ const r = rec(ME, UI.memberQ); r.missions = r.missions.filter(m=>m.id!==t.dataset.del); save(); render(); return; }
  if (t.dataset.chip){ const m = findMission(t.dataset.m); const arr = m.f[t.dataset.k] = m.f[t.dataset.k] || [];
    const i = arr.indexOf(t.dataset.chip); i>=0 ? arr.splice(i,1) : arr.push(t.dataset.chip);
    t.setAttribute('aria-pressed', i<0); save(); refreshVal(); return; }
  const act = t.dataset.act;
  if (act === 'draft'){ save(); toast('임시저장했습니다.'); return; }
  if (act === 'submit'){
    const v = validateMember(ME, UI.memberQ);
    if (v.errs.length){ refreshVal(); $('#val').scrollIntoView({block:'center', behavior:'smooth'}); toast(`제출 전에 ${v.errs.length}개 항목을 확인해 주세요.`); return; }
    const r = rec(ME, UI.memberQ); r.status = 'submitted'; r.review = null; save(); render();
    toast(`Q${UI.memberQ+1} 기록을 제출했습니다. ${LEADER} 팀장에게 리뷰와 1on1 일정 요청이 전달됩니다.`); return; }
  if (act === 'back'){ UI.review = null; render(); return; }
  if (act === 'approve' || act === 'reject'){
    const [mid, qi] = UI.review, r = rec(mid, qi), m = member(mid);
    if (act === 'reject'){
      const reason = $('#rv-reject').value.trim();
      if (!reason){ $('#rval').outerHTML = renderVal({errs:['반려 사유를 작성해 주세요. 구성원에게 그대로 전달됩니다.'],warns:[]},''); return; }
      r.status = 'rejected'; r.review = {rejectReason:reason, at:TODAY}; save();
      toast(`${m.name} Q${qi+1} 기록을 반려했습니다.`);
    } else {
      const v = validateReview(r);
      if (v.errs.length){ const el = $('#rval'); el.outerHTML = renderVal({errs:v.errs,warns:[]},''); return; }
      const no = `FO6-2026-${String(++S.seq).padStart(4,'0')}`;
      r.status = 'done';
      r.review = {meet:$('#rv-meet').value, quant:v.quant, expect:v.expect, feedback:v.fb, grants:v.grants, at:TODAY};
      r.gw = [{kind:'1on1 미팅 카드', no:no+'-1'}]; if (r.missions.length) r.gw.push({kind:'배지 신청서', no:no+'-2'});
      save();
      toast(`승인했습니다. 배지 ${v.total}개 부여, 그룹웨어 결재 문서 ${r.gw.length}건을 생성했습니다.`);
    }
    const next = pendingList()[0]; UI.review = next ? next : null; render(); scrollTo(0,0); return; }
  if (act === 'copy'){
    const tsv = exportTSV();
    const fallback = () => { $('#copyfb').hidden = false; const b = $('#copybox'); b.value = tsv; b.focus(); b.select(); };
    try { navigator.clipboard.writeText(tsv).then(()=>toast('표를 복사했습니다. 엑셀에 붙여넣으세요.'), fallback); } catch(err){ fallback(); }
    return; }
  if (act === 'reset'){ S = seed(); save(); UI.memberQ = 3; render(); toast('예시 데이터로 되돌렸습니다.'); return; }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.one){ const r = rec(ME, UI.memberQ); r.one[t.dataset.one] = t.type==='number' ? Number(t.value)||0 : t.value; save(); refreshVal(); return; }
  if (t.dataset.m && t.dataset.k && !t.dataset.chip){ const m = findMission(t.dataset.m); if (!m) return;
    if (t.type === 'checkbox'){ m.f[t.dataset.k] = t.checked; const end = $('#'+m.id+'-end'); if (end) end.disabled = t.checked; }
    else m.f[t.dataset.k] = t.value;
    save(); refreshVal(); return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.badges){ const m = findMission(t.dataset.badges); m.badges = Number(t.value); save(); render(); return; }
  if (t.dataset.qs || t.dataset.qe){ const qi = Number(t.dataset.qs ?? t.dataset.qe); S.settings.quarters[qi][t.dataset.qs!==undefined?'start':'end'] = t.value; save(); render(); return; }
  if (t.dataset.m && t.type==='checkbox'){ /* handled on input */ }
});

render();
</script>

</body></html>
